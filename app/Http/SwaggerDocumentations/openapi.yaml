openapi: 3.0.3
info:
  title: Sanoudji API
  description: |
    API REST de la plateforme Sanoudji – gestion de livres, catégories, auteurs, commandes et utilisateurs.

    **Authentification** : Utilisez l'endpoint `/auth/login` pour obtenir un token Bearer,
    puis cliquez sur le bouton **Authorize** pour le renseigner.
  version: 1.0.0
  contact:
    name: Sanoudji Team

servers:
  - url: http://localhost:8000/api
    description: Serveur de développement local

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token obtenu via /auth/login

  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          description: Données retournées (objet ou tableau selon l'endpoint)
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Erreur de validation."
        errors:
          type: object

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: john@example.com
        phone:
          type: string
          nullable: true
        profilePhotoUrl:
          type: string
          nullable: true
        id_role:
          type: string
          example: R02
        created_at:
          type: string
          format: date-time

    Author:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        bio:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Fiction
        description:
          type: string
          nullable: true
        coverUrl:
          type: string
          nullable: true
          example: /storage/images/fiction.jpg

    Book:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Le Petit Prince
        description:
          type: string
          nullable: true
        isbn:
          type: string
          nullable: true
          example: 978-2-07-040850-4
        price:
          type: number
          format: float
          example: 12.99
        stock:
          type: integer
          example: 50
        coverUrl:
          type: string
          nullable: true
          example: /storage/images/book.jpg
        publicationDate:
          type: string
          format: date
          nullable: true
          example: "1943-04-06"
        id_author:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/Author'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    MetadataAttribute:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Poids
        description:
          type: string
          nullable: true
        dataType:
          type: string
          enum: [text, number, date, boolean]
          example: number

tags:
  - name: Auth
    description: Authentification et gestion du compte utilisateur
  - name: Books
    description: Gestion du catalogue de livres
  - name: Categories
    description: Gestion des catégories de livres
  - name: Attributes
    description: Gestion des attributs de métadonnées (système EAV)

paths: {}
