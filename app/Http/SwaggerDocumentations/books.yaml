paths:
  /books:
    get:
      tags: [Books]
      summary: Liste de tous les livres
      description: Retourne la liste complète des livres avec leurs auteurs et catégories.
      operationId: booksIndex
      responses:
        '200':
          description: Liste récupérée avec succès
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Book'

    post:
      tags: [Books]
      summary: Créer un nouveau livre
      description: |
        Crée un livre et l'associe optionnellement à des catégories.
        L'image de couverture est stockée dans `storage/app/public/images`.
      operationId: booksStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, price, stock, id_author]
              properties:
                title:
                  type: string
                  example: Le Petit Prince
                description:
                  type: string
                  nullable: true
                isbn:
                  type: string
                  nullable: true
                  example: "978-2-07-040850-4"
                price:
                  type: number
                  example: 12.99
                stock:
                  type: integer
                  example: 50
                coverUrl:
                  type: string
                  format: binary
                  description: Image de couverture (jpeg, png, jpg, gif, svg – max 2Mo)
                publicationDate:
                  type: string
                  format: date
                  example: "1943-04-06"
                id_author:
                  type: string
                  format: uuid
                "categories[]":
                  type: array
                  items:
                    type: string
                    format: uuid
                  description: Tableau d'IDs de catégories
                "metadata":
                  type: array
                  items:
                    type: object
                    properties:
                      id_metadata_attribute:
                        type: string
                        format: uuid
                      value:
                        type: string
                  description: "Métadonnées personnalisées (ex: [{'id_attribute': '...', 'value': '...'}])"
      responses:
        '201':
          description: Livre créé avec succès
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Book'
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Non authentifié

  /books/{id}:
    get:
      tags: [Books]
      summary: Détails d'un livre
      description: Retourne un livre avec son auteur, ses catégories, ses métadonnées et ses avis.
      operationId: booksShow
      parameters:
        - name: id
          in: path
          required: true
          description: UUID du livre
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Détails récupérés
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Book'
        '404':
          description: Livre non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Books]
      summary: Mettre à jour un livre
      description: |
        Met à jour les champs fournis d'un livre.
        Si une nouvelle image est envoyée, l'ancienne est automatiquement supprimée.
      operationId: booksUpdate
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                isbn:
                  type: string
                price:
                  type: number
                stock:
                  type: integer
                coverUrl:
                  type: string
                  format: binary
                publicationDate:
                  type: string
                  format: date
                id_author:
                  type: string
                  format: uuid
                "categories[]":
                  type: array
                  items:
                    type: string
                "metadata":
                  type: array
                  items:
                    type: object
                    properties:
                      id_metadata_attribute:
                        type: string
                        format: uuid
                      value:
                        type: string
      responses:
        '200':
          description: Livre mis à jour
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Book'
        '404':
          description: Livre non trouvé
        '401':
          description: Non authentifié

    delete:
      tags: [Books]
      summary: Supprimer un livre
      description: Supprime un livre et son image de couverture associée.
      operationId: booksDestroy
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Livre supprimé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Livre non trouvé
        '401':
          description: Non authentifié
