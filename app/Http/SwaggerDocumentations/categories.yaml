paths:
  /categories:
    get:
      tags: [Categories]
      summary: Liste de toutes les catégories
      description: Retourne la liste complète des catégories.
      operationId: categoriesIndex
      responses:
        '200':
          description: Liste récupérée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'

    post:
      tags: [Categories]
      summary: Créer une catégorie
      description: |
        Crée une nouvelle catégorie.
        L'image de couverture est stockée dans `storage/app/public/images`.
      operationId: categoriesStore
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Science-Fiction
                description:
                  type: string
                  nullable: true
                  example: Romans de science-fiction
                coverUrl:
                  type: string
                  format: binary
                  description: Image (jpeg, png, jpg, gif, svg – max 2Mo)
      responses:
        '201':
          description: Catégorie créée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '422':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Non authentifié

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Détails d'une catégorie avec ses livres
      description: Retourne une catégorie et la liste complète de ses livres associés.
      operationId: categoriesShow
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Détails récupérés
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Category'
                          - type: object
                            properties:
                              books:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Book'
        '404':
          description: Catégorie non trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Categories]
      summary: Mettre à jour une catégorie
      description: |
        Met à jour les champs d'une catégorie.
        Si une nouvelle image est envoyée, l'ancienne est automatiquement supprimée.
      operationId: categoriesUpdate
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                coverUrl:
                  type: string
                  format: binary
      responses:
        '200':
          description: Catégorie mise à jour
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Category'
        '404':
          description: Catégorie non trouvée
        '422':
          description: Erreur de validation
        '401':
          description: Non authentifié

    delete:
      tags: [Categories]
      summary: Supprimer une catégorie
      description: Supprime une catégorie et son image de couverture associée.
      operationId: categoriesDestroy
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Catégorie supprimée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Catégorie non trouvée
        '401':
          description: Non authentifié
